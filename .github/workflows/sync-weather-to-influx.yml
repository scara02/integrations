name: Sync Fabric Weather Data to InfluxDB

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

jobs:
  sync-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Microsoft ODBC Driver 18
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg unixodbc unixodbc-dev

          curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          pip install pandas pyodbc azure-identity influxdb-client

      - name: Sync Fabric Lakehouse to InfluxDB
        env:
          FABRIC_SQL_SERVER: ${{ secrets.FABRIC_SQL_SERVER }}
          FABRIC_SQL_DATABASE: ${{ secrets.FABRIC_SQL_DATABASE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}

          FABRIC_TABLE: "dbo.weather_nyc_hourly"
          LOOKBACK_HOURS: "40000"
        run: |
          python scripts/fabric_to_influx.py
